[package]
name = "hello-playbook"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT OR Apache-2.0 OR GPL-3.0-or-later"

[dependencies]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
wasm = ["dep:wasm-bindgen", "dep:console_error_panic_hook"]

[dependencies.wasm-bindgen]
version = "0.2"
optional = true

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true
