<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="680" height="190" class="pk-figure" data-figure="gate" data-state="ch05" data-states="ch02 ch03 ch05" role="img" aria-label="The gate at ch05: ayce depends on build, fmt, lint, test, audit">
  <line class="edge" x1="340" y1="60" x2="80" y2="130" stroke="#718096" stroke-width="2"/>
